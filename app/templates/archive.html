<div id="archive" hidden>
  <div class="workspace">
    <section class="panel">
      <div class="panel-heading"><h2>班报记录</h2></div>
      <div id="archive-table" class="table-scroll"></div>
    </section>
    <section class="panel">
      <div class="panel-heading"><h2>归档操作</h2></div>
      <div class="archive-detail">
        <dl id="archive-detail"></dl>
        <div class="tools" id="archive-actions" hidden>
          <button type="button" id="rerun">重跑归档</button>
          <a class="button" id="download" download>下载证据</a>
        </div>
        <p id="run-feedback" role="status"></p>
      </div>
    </section>
  </div>
</div>
