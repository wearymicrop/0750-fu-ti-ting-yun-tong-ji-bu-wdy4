<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扶梯停运统计簿</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/layout.css">
  <link rel="stylesheet" href="/static/timeline.css">
  <link rel="stylesheet" href="/static/tables.css">
  <script type="module" src="/static/workbench.mjs"></script>
</head>
<body>
<div class="shell">
  {% include 'rail.html' %}
  <div class="work">
    {% include 'toolbar.html' %}
    <main id="content" tabindex="-1">
      {% include 'overview.html' %}
      {% include 'stage.html' %}
      {% include 'archive.html' %}
    </main>
    <footer class="statusbar">
      <span id="status" role="status" aria-live="polite">载入中</span>
      <span>东八区 <span class="mono">UTC+08:00</span></span>
      <span class="mono">规则 {{ version }}</span>
    </footer>
  </div>
</div>
</body>
</html>
